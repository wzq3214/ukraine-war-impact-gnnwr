name: tests

on:
  push:
  pull_request:

jobs:
  utility-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile reproducibility/section_3_4_gnnwr_official_workflow.py
      - name: Run self-test
        run: python reproducibility/section_3_4_gnnwr_official_workflow.py --self-test
      - name: Run unit tests
        run: pytest -q
